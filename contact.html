<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>
    <!-- Header Section -->
    <header>
        <div class="logo-container">
            <img src="images/Phytomax_Logo.png" alt="Phytomax Logo">
        </div>
        <nav>

                <li><a href="index.html">Home</a></li>

        </nav>

    <!-- Contact Section -->
    <section class="contact">
        <h2>Contact Us</h2>
        <p>We'd love to hear from you! Whether you have a question, feedback, or inquiry, feel free to reach out to us.</p>

        <form id="contactForm" action="#" method="POST">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
        
            <button type="submit">Send</button>
        </form>
        
    </section>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2025 Phytomax. All Rights Reserved.</p>
        <div class="social-media">
            <a href="https://facebook.com/phytomax">Facebook</a>
            <a href="https://twitter.com/phytomax">Twitter</a>
            <a href="https://instagram.com/phytomax">Instagram</a>
        </div>
    </footer>
</body>
</html>
